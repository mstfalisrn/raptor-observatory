name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------ Birim test + coverage (PostgreSQL + Redis service container'lı)
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raptor
          POSTGRES_PASSWORD: raptor
          POSTGRES_DB: raptor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raptor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r packages/requirements-api.txt -r packages/requirements-worker.txt -r packages/requirements-dev.txt
      - name: Run tests with coverage
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://raptor:raptor@localhost:5432/raptor_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ -q \
            --cov=packages \
            --cov-report=term-missing \
            --cov-fail-under=70

  # ------------------------------------------------------ Lint (fail-closed)
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          args: "check packages apps migrations tests"

  # ------------------------------------------------------ Güvenlik (bandit 0 High)
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit (0 High)
        run: bandit -r packages apps -c pyproject.toml -ll -x tests,migrations

  # ------------------------------------------------------ Secret taraması (fail-closed)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run secret scan
        run: ./scripts/secret-scan.sh .

  # ------------------------------------------------------ Compose doğrulama
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config --quiet
